<!DOCTYPE html>
<html>
<head>
<title>PolicyNav Public Policy Navigation Using AI</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-TvXU29P0ykS0/8m5tRLbXHw7vBbTg1Xe8PCV+0xvnZsAqVskZd+L4C2T7cQ2gjy0lCMk2mO6e/9jk3Jr5QW4Ug==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<style>
body {
    font-family: 'Roboto', sans-serif;
    background: #f5f6fa; /* light white background */
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #333;
    min-height: 100vh;
}

h1 {
    margin-top: 40px;
    font-size: 3rem;
    font-weight: 900;
    text-align: center;
    background: linear-gradient(90deg, #11998e, #38ef7d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 2px 2px 8px rgba(206, 211, 225, 0.25);
}

.dashboard {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 80px;
    width: 90%;
    max-width: 900px;
}

.card {
    background: #ffffff;
    color: #333;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    padding: 40px 30px;
    text-align: center;
    width: 250px;
    transition: transform 0.3s, box-shadow 0.3s;
    cursor: pointer;
    text-decoration: none;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
}

.card i {
    font-size: 40px;
    margin-bottom: 15px;
}
.card h2 {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
    color: #111;
    text-shadow: 0.5px 0.5px 1px rgba(0,0,0,0.1);
}
.card p {
    margin-top: 10px;
    font-size: 15px;
    color: #444;
    line-height: 1.4;
}

/* Card colors */
.education { background: #ff6b6b; color: #fff; }
.education i { color: #fff; }
.poverty { background: #4ecdc4; color: #fff; }
.poverty i { color: #fff; }

@media (max-width: 600px) {
    .dashboard {
        flex-direction: column;
        align-items: center;
    }

    .card {
        width: 80%;
    }
}
</style>
</head>
<body>
<h1>PolicyNav Dashboard</h1>

<div class="dashboard">
    <!-- Education Card -->
    <a href="/call_education" class="card education">
        <i class="fas fa-book"></i>
        <h2>Education Policies</h2>
        <p>Explore AI-driven insights on education policies.</p>
    </a>

    <!-- Poverty Card -->
    <a href="/call_poverty" class="card poverty">
        <i class="fas fa-users"></i>
        <h2> Poverty In India </h2>
        <p>Analyze poverty data with AI recommendations.</p>
    </a>
</div>

</body>
</html>
