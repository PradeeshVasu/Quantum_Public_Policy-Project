<!DOCTYPE html>
<html>
<head>
<title>PolicyNav Public (Education) Policy Navigation Using AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f2f5;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #333;
    }
    h1 {
        margin-top: 40px;
        color: #2c3e50;
        text-align: center;
        font-weight: 700;
        font-size: 2rem;
    }
    form {
        margin: 25px 0;
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    input[type="text"] {
        width: 400px;
        padding: 12px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid #ccc;
        transition: 0.3s;
    }
    input[type="text"]:focus {
        border-color: #2980b9;
        outline: none;
        box-shadow: 0 0 5px rgba(41, 128, 185, 0.3);
    }
    button {
        padding: 12px 25px;
        font-size: 16px;
        background-color: #2980b9;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.3s;
    }
    button:hover { background-color: #3498db; }
    .results-container {
        width: 85%;
        max-width: 1100px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-bottom: 50px;
    }
    .result-card {
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0px 6px 18px rgba(0,0,0,0.08);
        padding: 20px;
        transition: transform 0.2s, box-shadow 0.2s;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
    }
    .result-card:hover {
        transform: translateY(-3px);
        box-shadow: 0px 10px 25px rgba(0,0,0,0.12);
    }
    .result-card h3 { margin: 0 0 6px 0; line-height: 1.2; }
    .result-card .meta { margin: 0; line-height: 1.2; font-size: 13px; color: #888; }
    .result-card .meta + .meta { margin-top: 2px; }
    .result-card p { margin: 5px 0 0 0; line-height: 1.4; }
    .score { font-weight: 600; color: #27ae60; }

    .charts-wrapper {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
        width: 90%;
        max-width: 1100px;
        margin-bottom: 50px;
    }
    .chart-container {
        flex: 1 1 500px;
        height: 550px;  /* increased height for bigger charts */
        background-color: #fff;
        padding: 20px;
        border-radius: 16px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        display: flex;
        justify-content: center;
        align-items: center;
    }
    canvas { max-width: 100%; max-height: 100%; }

    @media (max-width: 900px) {
        .charts-wrapper { flex-direction: column; align-items: center; }
        .chart-container { height: 400px; }
    }
    @media (max-width: 600px) {
        input[type="text"] { width: 90%; }
        .results-container { width: 95%; }
        .chart-container { width: 90%; height: 300px; }
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<h1><i class="fas fa-magnifying-glass"></i> Education Policy Navigation Using AI</h1>
<form method="post" action="/search_education">
<input type="text" name="query" placeholder="Enter your query..." required>
<button type="submit">Search</button>
</form>

{% if results %}
<div class="results-container">
    {% for r in results %}
    <div class="result-card">
        <h3>{{ r.title }} ({{ r.policy_id }})</h3>
        <div class="meta">
            Region: {{ r.region }} | Year: {{ r.year }} | Status: {{ r.status }}
        </div>
        <div class="meta">
            Relevance Score: <span class="score">{{ r.score }}</span>
        </div>
        <p>{{ r.summary }}</p>
    </div>
    {% endfor %}
</div>

<div class="charts-wrapper">
    <div class="chart-container" style="height: 400px;"> <!-- normal card size -->
        <canvas id="impactPieChart"></canvas>
    </div>
    <div class="chart-container" style="height: 400px;"> <!-- normal card size -->
        <canvas id="fundingBarChart"></canvas>
    </div>
</div>



<script>
const labels = [];
const impactScores = [];
const funding = [];

{% for r in results %}
labels.push("{{ r.title }}");
impactScores.push({{ r.impact_score | default(0) | float }});
funding.push({{ r.funding_million_usd | default(0) | float }});
{% endfor %}

const colors = ['#2980b9','#27ae60','#f39c12','#e74c3c','#8e44ad','#3498db','#16a085','#f1c40f','#d35400','#2c3e50'];

// Pie Chart - Impact Score
new Chart(document.getElementById('impactPieChart'), {
    type: 'pie',
    data: { labels: labels, datasets: [{ data: impactScores, backgroundColor: colors }] },
    options: {
        responsive: true,
        plugins: { 
            legend: { position: 'bottom' }, 
            title: { display: true, text: 'Policy Impact Score Distribution', font: { size: 18 }, position: 'top' } 
        }
    }
});

// Bar Chart - Funding
new Chart(document.getElementById('fundingBarChart'), {
    type: 'bar',
    data: { labels: labels, datasets: [{ label: 'Funding (M USD)', data: funding, backgroundColor: colors }] },
    options: {
        responsive: true,
        maintainAspectRatio: false, // allow chart to fill canvas
        plugins: { 
            legend: { display: false }, 
            title: { display: true, text: 'Funding Allocation by Policy', font: { size: 20 }, position: 'top' } 
        },
        scales: { 
            y: { beginAtZero: true, title: { display: true, text: 'Funding (M USD)' } }, 
            x: { title: { display: false }, ticks: { maxRotation: 90, minRotation: 45 } }  
        },
        barPercentage: 0.8,  // thicker bars
        categoryPercentage: 0.7
    }
});

</script>

{% endif %}
</body>
</html>
